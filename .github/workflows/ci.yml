name: CI

# Validación de cada PR hacia develop o main: análisis estático + tests.
# No compila nada publicable: el App Bundle sale solo de `main`
# (release-internal.yml), que reutiliza este mismo workflow como puerta.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Dependencias
        run: flutter pub get

      # Los .g.dart están versionados: no hace falta build_runner en CI.
      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test
