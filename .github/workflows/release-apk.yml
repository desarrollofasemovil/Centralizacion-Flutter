name: Release APK

# Compila el APK release SOLO cuando un PR develop -> main se fusiona.
# (No corre en pushes directos a main ni en PRs sin fusionar.)
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

# Un solo release a la vez; no cancelar uno en curso a medias.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: APK ${{ matrix.flavor }}
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Para sumar Manizales: agregar `manizales` aquí y su secreto
        # GOOGLE_SERVICES_MANIZALES_JSON_B64 (ver docs/CI_CD.md). Hoy NO está:
        # en este repo `manizales` sigue con fixedMunicipalityId: 0 y sin
        # android/app/src/manizales/.
        flavor: [municipios]
    steps:
      - uses: actions/checkout@v4
        with:
          # Commit de la fusión en main (no el HEAD del PR).
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Verificar secretos
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_MUNICIPIOS_JSON_B64 }}
        run: |
          missing=0
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS GOOGLE_SERVICES_B64; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto asociado a $v (ver docs/CI_CD.md)"; missing=1; fi
          done
          exit $missing

      # Sin key.properties Gradle firmaría con la debug key: por eso los secretos son obligatorios.
      - name: Firma release y google-services.json
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_MUNICIPIOS_JSON_B64 }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir -p android/keys "android/app/src/$FLAVOR"
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keys/release.jks
          printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > "android/app/src/$FLAVOR/google-services.json"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=../keys/release.jks"
          } > android/key.properties

      - name: Dependencias
        run: flutter pub get

      - name: Compilar APK release
        run: flutter build apk --release --flavor ${{ matrix.flavor }} -t lib/main_${{ matrix.flavor }}.dart

      - name: Resumen
        run: |
          apk="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk"
          {
            echo "### APK ${{ matrix.flavor }}"
            echo "- Commit: \`${{ github.event.pull_request.merge_commit_sha }}\`"
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Tamaño: $(du -h "$apk" | cut -f1)"
            echo "- SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-pr${{ github.event.pull_request.number }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Limpiar credenciales
        if: always()
        run: rm -rf android/keys android/key.properties android/app/src/*/google-services.json
